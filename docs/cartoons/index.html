<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cartoons · a-bit-odd</title>
  <link rel="icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../style.css">
  <style>
    body { overflow: auto; }
    .page {
      max-width: 38rem;
      margin: 0 auto;
      padding: 12vh 16px 20vh;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 16px;
      line-height: 1.75;
      color: var(--ink);
    }
    /* 86 pixels breed tegen 77 bij curiosa, dus naar verhouding breder */
    .title { display: block; width: min(51vw, 223px); margin-bottom: 4vh; }
    .intro { color: var(--muted); margin: 0 0 10vh; }
    .title svg { width: 100%; height: auto; }
    .cartoon { margin: 0 0 10vh; }
    .cartoon h2 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 1em;
      padding-left: 1em;
      border-left: 2px solid var(--thread);
    }
    .cartoon img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="page">
    <a class="title node" href="../" aria-label="terug naar a-bit-odd">
      <svg id="title" viewBox="-1 -1 88 18"></svg>
    </a>

    <p class="intro">zonder clou</p>

    <section class="cartoon">
      <h2>Pompeii</h2>
      <img src="media/pompeii.webp" width="1344" height="896" loading="lazy"
           alt="Pompeii, 79 n.Chr. Een oude Romein bekijkt de as op zijn toga terwijl de Vesuvius uitbarst. Hij denkt: dit krijg ik nooit meer uit mijn toga.">
    </section>

    <section class="cartoon">
      <h2>Camouflage</h2>
      <img src="media/soldaat.webp" width="1344" height="896" loading="lazy"
           alt="Een soldaat in een groen veldtenue staat in een moeras, met helikopters en rook achter hem. Hij denkt: dit heeft niets meer met fashion te maken.">
    </section>

    <section class="cartoon">
      <h2>Leesvoorkeur</h2>
      <img src="media/kabouter.webp" width="1024" height="1024" loading="lazy"
           alt="Een kabouter met een rode puntmuts, een ruige baard en een peuk in zijn mond staat tegen een blauwe muur. Zijn hemd is te kort voor zijn buik. Hij zegt: non-fictie kan m'n kloten kussen!">
    </section>

    <section class="cartoon">
      <h2>Vakadvies</h2>
      <img src="media/groenteboer.webp" width="1024" height="1024" loading="lazy"
           alt="Een groenteboer in een wit schort staat achter een stapel appels en een stapel peren en steekt belerend zijn vinger op. Hij zegt: dat is plasseks met poepseks vergelijken. Een kale klant met een appel en een peer in zijn handen kijkt hem wezenloos aan.">
    </section>

    <section class="cartoon">
      <img src="media/das-brot.webp" width="1024" height="1174" loading="lazy"
           alt="Das Brot. Een brood met grote ogen en rode lippen drijft in zee, met een duikbootkoepel en twee periscopen op zijn korst.">
    </section>

    <section class="cartoon">
      <h2>Nagesprek</h2>
      <img src="media/nagesprek.webp" width="1024" height="1024" loading="lazy"
           alt="Een man en een vrouw van middelbare leeftijd in leren riemenpakjes liggen naast elkaar op bed en roken een sigaret. Op het nachtkastje staan een kopje thee en een zweep. De man zegt: ik heb nooit iets met jazz gekund.">
    </section>
  </main>

  <script src="../pixels.js"></script>
  <script>
    // Titel in pixelletters: 8 tekens × 11 − 2 = 86 pixels breed, 16 hoog
    document.getElementById("title").appendChild(Pixels.pixelWord("cartoons", 43, 8, 1));
  </script>
</body>
</html>
